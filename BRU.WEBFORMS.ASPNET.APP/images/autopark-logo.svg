<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Windows XP style gradient background -->
  <defs>
    <linearGradient id="xpGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2459C3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1447AE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="busGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EDF2FB;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background with XP style -->
  <rect width="200" height="60" fill="url(#xpGradient)" rx="3"/>
  <rect x="0" y="0" width="200" height="2" fill="#8CACDF" rx="1"/>
  
  <!-- Windows XP style bus icon -->
  <g transform="translate(8, 12)">
    <!-- Bus body with XP gradient -->
    <rect x="0" y="8" width="36" height="22" fill="url(#busGradient)" stroke="#1447AE" stroke-width="1" rx="2"/>
    
    <!-- Windows with XP blue -->
    <rect x="4" y="12" width="7" height="6" fill="#1447AE" rx="1"/>
    <rect x="13" y="12" width="7" height="6" fill="#1447AE" rx="1"/>
    <rect x="22" y="12" width="7" height="6" fill="#1447AE" rx="1"/>
    
    <!-- Wheels -->
    <circle cx="9" cy="34" r="4" fill="#333333" stroke="#000000" stroke-width="1"/>
    <circle cx="27" cy="34" r="4" fill="#333333" stroke="#000000" stroke-width="1"/>
    
    <!-- Bus details -->
    <rect x="2" y="24" width="32" height="3" fill="#1447AE" rx="1"/>
  </g>
  
  <!-- Text with Windows XP style -->
  <text x="50" y="24" font-family="Tahoma, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">AUTOPARK</text>
  <text x="50" y="40" font-family="Tahoma, Arial, sans-serif" font-size="9" fill="#EDF2FB">Management System</text>
  
  <!-- XP style accent -->
  <rect x="48" y="46" width="100" height="1" fill="#8CACDF"/>
</svg>