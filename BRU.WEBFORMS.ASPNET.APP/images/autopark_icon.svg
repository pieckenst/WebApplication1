<?xml version="1.0" encoding="UTF-8"?>
<svg width="220" height="60" viewBox="0 0 220 60" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>AUTOPARK — Fleet Management System</title>
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7CA6ED"/>
      <stop offset="45%" stop-color="#3070DB"/>
      <stop offset="100%" stop-color="#123F8F"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="busBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C7D7F2"/>
    </linearGradient>
    <linearGradient id="busGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5C8CE0"/>
      <stop offset="100%" stop-color="#1D4CA0"/>
    </linearGradient>
    <radialGradient id="globeGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#9CC6F7"/>
      <stop offset="100%" stop-color="#164D9E"/>
    </radialGradient>
  </defs>

  <!-- outer beveled banner -->
  <rect x="0.5" y="0.5" width="219" height="59" rx="4" fill="url(#bannerBg)" stroke="#0B3A80" stroke-width="1"/>
  <!-- glossy sheen -->
  <rect x="1.5" y="1.5" width="217" height="22" rx="3.5" fill="url(#gloss)"/>

  <!-- globe accent, echoing the classic Windows badge -->
  <circle cx="26" cy="34" r="15" fill="url(#globeGrad)" stroke="#0B3A80" stroke-width="0.75"/>
  <path d="M11 34 H41 M26 19 C33 19 33 49 26 49 C19 49 19 19 26 19" fill="none" stroke="#D6E7FC" stroke-width="0.75" opacity="0.75"/>
  <path d="M14.5 26 C21 23 31 23 37.5 26 M14.5 42 C21 45 31 45 37.5 42" fill="none" stroke="#D6E7FC" stroke-width="0.75" opacity="0.55"/>

  <!-- bus, glassy XP-style -->
  <g transform="translate(9,19)">
    <ellipse cx="18" cy="34" rx="17" ry="3" fill="#04255E" opacity="0.35"/>
    <rect x="1" y="6" width="34" height="22" rx="3" fill="url(#busBody)" stroke="#295BA8" stroke-width="1"/>
    <rect x="4" y="10" width="7" height="6" rx="1" fill="url(#busGlass)"/>
    <rect x="13" y="10" width="7" height="6" rx="1" fill="url(#busGlass)"/>
    <rect x="22" y="10" width="7" height="6" rx="1" fill="url(#busGlass)"/>
    <rect x="2" y="22" width="32" height="3" rx="1" fill="#295BA8" opacity="0.55"/>
    <circle cx="9" cy="30" r="4" fill="#2B2B2B" stroke="#111111" stroke-width="0.75"/>
    <circle cx="27" cy="30" r="4" fill="#2B2B2B" stroke="#111111" stroke-width="0.75"/>
    <circle cx="9" cy="30" r="1.4" fill="#8A8A8A"/>
    <circle cx="27" cy="30" r="1.4" fill="#8A8A8A"/>
  </g>

  <!-- text with drop shadow, Tahoma bold like classic XP notifications -->
  <text x="52" y="27" font-family="Tahoma, Verdana, sans-serif" font-size="15" font-weight="bold" fill="#04214D" opacity="0.45">AUTOPARK</text>
  <text x="51" y="26" font-family="Tahoma, Verdana, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">AUTOPARK</text>
  <text x="52" y="43" font-family="Tahoma, Verdana, sans-serif" font-size="9.5" fill="#04214D" opacity="0.4">Fleet Management System</text>
  <text x="51" y="42" font-family="Tahoma, Verdana, sans-serif" font-size="9.5" fill="#E3EDFC">Fleet Management System</text>
</svg>
